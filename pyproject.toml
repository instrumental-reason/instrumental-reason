[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "instrumental-reason"
version = "0.0.1"
authors = [
    {name="Machina Ratiocinatrix", email="machina.ratio@gmail.com"},
    {name="Alexander Fedotov", email="alex.fedotov@aol.com"}
]
description = "Instrumental-Reason ..."
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
]
keywords = ["instrumental-reason"]
dependencies = [
    "pyyaml == 6.0.3"
]

[project.scripts]
instrumental-reason = "instrumental_reason.cli:run"

[project.urls]
"Homepage" = "https://github.com/instrumental-reason/instrumental-reason"

[dependency-groups]
dev = ["pytest>=8.0.0"]